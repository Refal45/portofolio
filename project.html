<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Raifal Fadhal Zahran | Galeri Proyek</title>
    <!-- Bootstrap 5 + Font Awesome + Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition:
          background-color 0.25s ease,
          color 0.2s ease,
          border-color 0.2s,
          box-shadow 0.2s;
      }

      :root {
        --bg-body: #f9fafb;
        --bg-surface: #ffffff;
        --bg-sidebar: #ffffff;
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --text-muted: #6b7280;
        --border-color: #e5e7eb;
        --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        --hover-bg: #f3f4f6;
        --active-color: #2563eb;
        --active-bg: #eff6ff;
        --badge-bg: #f3f4f6;
        --badge-text: #1f2937;
        --toast-bg: #ffffff;
        --toast-text: #111827;
        --demo-btn-bg: #2563eb10;
        --demo-btn-hover: #2563eb20;
        --overlay-bg: rgba(0, 0, 0, 0.5);
        --header-bg: rgba(255, 255, 255, 0.85);
      }

      body.dark {
        --bg-body: #0f172a;
        --bg-surface: #1e293b;
        --bg-sidebar: #1e293b;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        --hover-bg: #334155;
        --active-color: #60a5fa;
        --active-bg: #1e3a8a;
        --badge-bg: #334155;
        --badge-text: #e2e8f0;
        --toast-bg: #1e293b;
        --toast-text: #f1f5f9;
        --demo-btn-bg: #3b82f620;
        --demo-btn-hover: #3b82f640;
        --overlay-bg: rgba(0, 0, 0, 0.7);
        --header-bg: rgba(30, 41, 59, 0.9);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-body);
        color: var(--text-primary);
        line-height: 1.5;
      }

      h1,
      h2,
      h3,
      .nav-link-custom {
        font-family: 'Poppins', sans-serif;
      }

      .portfolio-grid {
        display: grid;
        grid-template-columns: 300px 1fr;
        min-height: 100vh;
        max-width: 1400px;
        margin: 0 auto;
        background-color: var(--bg-body);
      }

      /* SIDEBAR (desktop style) */
      .sidebar {
        background-color: var(--bg-sidebar);
        border-right: 1px solid var(--border-color);
        padding: 2rem 1.5rem;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      /* Tombol close sidebar (hanya tampil mobile) */
      .sidebar-close {
        display: none;
        background: transparent;
        border: none;
        font-size: 1.6rem;
        color: var(--text-secondary);
        cursor: pointer;
        align-self: flex-end;
        margin-bottom: 1rem;
        padding: 0;
        line-height: 1;
      }
      .sidebar-close:hover {
        color: var(--active-color);
      }

      .profile-img-container {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .profile-img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid var(--active-color);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      }
      .greeting {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--active-color);
        text-align: center;
        margin-bottom: 0.5rem;
      }
      .fullname {
        font-size: 1.5rem;
        font-weight: 800;
        text-align: center;
        margin-bottom: 0.25rem;
      }
      .username {
        font-size: 0.85rem;
        color: var(--text-muted);
        text-align: center;
        margin-bottom: 1.8rem;
        padding-bottom: 1rem;
        border-bottom: 1px dashed var(--border-color);
      }
      .nav-menu {
        list-style: none;
        padding: 0;
        margin: 0.5rem 0 0 0;
        flex: 1;
      }
      .nav-menu li {
        margin-bottom: 0.6rem;
      }
      .nav-link-custom {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0.7rem 1rem;
        border-radius: 60px;
        font-weight: 500;
        color: var(--text-secondary);
        text-decoration: none;
        transition: all 0.2s;
      }
      .nav-link-custom:hover {
        background-color: var(--hover-bg);
        color: var(--active-color);
        transform: translateX(5px);
      }
      .active-link {
        background-color: var(--active-bg);
        color: var(--active-color);
        font-weight: 600;
      }
      .theme-switch-wrapper {
        margin-top: auto;
        padding-top: 2rem;
        border-top: 1px solid var(--border-color);
      }
      .dark-mode-btn {
        background: var(--badge-bg);
        border: 1px solid var(--border-color);
        border-radius: 40px;
        padding: 0.6rem 1rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-primary);
        width: 100%;
        justify-content: center;
      }

      /* MAIN CONTENT */
      .main-content {
        padding: 2rem 2.5rem;
        overflow-y: auto;
        position: relative;
      }

      /* ========== MOBILE HEADER MODERN ========== */
      .mobile-header {
        display: none;
        align-items: center;
        justify-content: space-between;
        background: var(--header-bg);
        backdrop-filter: blur(12px);
        padding: 0.8rem 1.2rem;
        position: sticky;
        top: 0;
        z-index: 1020;
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 1rem;
      }
      .mobile-header .menu-icon {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 40px;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        cursor: pointer;
        color: var(--text-primary);
        transition: 0.2s;
        box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      }
      .mobile-header .menu-icon:hover {
        background: var(--hover-bg);
        transform: scale(0.97);
      }
      .mobile-header .brand {
        font-weight: 700;
        font-size: 1.1rem;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, var(--active-color), #8b5cf6);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        letter-spacing: -0.2px;
      }
      .mobile-header .right-placeholder {
        width: 44px;
      }

      /* Overlay gelap untuk mobile drawer */
      .sidebar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--overlay-bg);
        z-index: 1040;
        display: none;
        backdrop-filter: blur(3px);
      }
      .sidebar-overlay.active {
        display: block;
      }

      .info-badge {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1.8rem;
      }
      .location-chip,
      .open-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--badge-bg);
        padding: 0.45rem 1.2rem;
        border-radius: 40px;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }
      .open-chip {
        background: #dcfce7;
        color: #15803d;
        border: none;
      }
      body.dark .open-chip {
        background: #14532d;
        color: #bbf7d0;
      }
      .section-title {
        font-weight: 700;
        font-size: 1.6rem;
        margin-top: 2rem;
        margin-bottom: 1.2rem;
        border-left: 5px solid var(--active-color);
        padding-left: 1rem;
      }
      .project-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      .project-card {
        background: var(--bg-surface);
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        box-shadow: var(--card-shadow);
        transition:
          transform 0.2s,
          border-color 0.2s;
        cursor: pointer;
        display: flex;
        flex-direction: column;
      }
      .project-card:hover {
        transform: translateY(-5px);
        border-color: var(--active-color);
      }
      .project-card img,
      .project-card video {
        width: 100%;
        height: 200px;
        object-fit: cover;
        background: #000;
        display: block;
      }
      .project-info {
        padding: 1rem;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .project-title {
        font-weight: 700;
        font-size: 1rem;
        margin-bottom: 0.25rem;
      }
      .project-caption {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
      }
      .tech-stack-badge {
        display: inline-block;
        background: var(--active-bg);
        color: var(--active-color);
        font-size: 0.7rem;
        padding: 0.2rem 0.8rem;
        border-radius: 20px;
        margin-top: 0.5rem;
        width: fit-content;
      }
      .demo-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--demo-btn-bg);
        color: var(--active-color);
        font-size: 0.7rem;
        font-weight: 600;
        padding: 0.3rem 0.8rem;
        border-radius: 40px;
        text-decoration: none;
        margin-top: 0.6rem;
        width: fit-content;
        transition: 0.2s;
        border: 1px solid var(--border-color);
      }
      .demo-link:hover {
        background: var(--demo-btn-hover);
        color: var(--active-color);
        transform: translateX(3px);
      }

      /* ========== FIX FULLSCREEN VIDEO TIDAK TERPOTONG ========== */
      /* Saat fullscreen, video akan tampil dengan object-fit contain (seluruh video terlihat, mungkin ada black bar) */
      video:fullscreen,
      video:-webkit-full-screen,
      video:fullscreen {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: contain !important; /* Mengganti cover menjadi contain agar tidak terpotong */
        background-color: #000 !important;
        max-width: none !important;
        max-height: none !important;
      }
      /* Fallback untuk browser lama */
      video:-webkit-full-screen {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: contain !important;
        background-color: #000 !important;
      }
      /* Saat tidak fullscreen, kembali ke cover untuk preview rapi */
      video:not(:fullscreen) {
        object-fit: cover;
        width: 100%;
        height: 200px;
      }
      /* Mencegah scroll saat fullscreen */
      :-webkit-full-screen {
        overflow: hidden !important;
      }
      :fullscreen {
        overflow: hidden !important;
      }

      /* Lightbox modal */
      .image-modal .modal-dialog {
        max-width: 95vw;
        margin: 1.75rem auto;
      }
      .image-modal .modal-content {
        background: transparent;
        border: none;
      }
      .image-modal .modal-body {
        padding: 0;
        text-align: center;
      }
      .image-modal img {
        max-width: 100%;
        max-height: 90vh;
        width: auto;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3);
      }
      .custom-toast {
        position: fixed;
        bottom: 25px;
        right: 25px;
        background: var(--toast-bg);
        color: var(--toast-text);
        padding: 12px 20px;
        border-radius: 50px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        font-size: 0.85rem;
        font-weight: 500;
        z-index: 1100;
        backdrop-filter: blur(8px);
        border-left: 4px solid var(--active-color);
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.3s,
          transform 0.3s;
        pointer-events: none;
      }
      .custom-toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .back-to-top {
        position: fixed;
        bottom: 25px;
        left: 25px;
        background: var(--active-color);
        color: white;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        transition: 0.2s;
        z-index: 1000;
        border: none;
      }
      .back-to-top.show {
        opacity: 1;
        visibility: visible;
      }
      .last-updated {
        text-align: center;
        font-size: 0.7rem;
        margin-top: 2rem;
        color: var(--text-muted);
      }

      /* ========== RESPONSIVE MOBILE DRAWER ========== */
      @media (max-width: 850px) {
        .portfolio-grid {
          grid-template-columns: 1fr;
        }
        .mobile-header {
          display: flex;
        }
        .sidebar {
          position: fixed;
          top: 0;
          left: -100%;
          width: 280px;
          height: 100%;
          z-index: 1050;
          transition: left 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
          box-shadow: 4px 0 20px rgba(0, 0, 0, 0.2);
          border-right: 1px solid var(--border-color);
          padding-top: 1rem;
        }
        .sidebar.open {
          left: 0;
        }
        .sidebar-close {
          display: block;
          margin-right: 0.5rem;
          margin-top: 0.2rem;
        }
        .main-content {
          padding: 0 1.2rem 2rem 1.2rem;
        }
        .back-to-top {
          bottom: 15px;
          left: 15px;
        }
        .custom-toast {
          bottom: 15px;
          right: 15px;
        }
        .section-title {
          font-size: 1.4rem;
        }
        .project-card video {
          height: 200px;
        }
      }
    </style>
  </head>
  <body>
    <!-- OVERLAY (mobile) -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="portfolio-grid">
      <aside class="sidebar" id="mainSidebar">
        <button class="sidebar-close" id="closeSidebarBtn" aria-label="Tutup menu"><i class="fas fa-times"></i></button>
        <div class="profile-img-container">
          <img src="profile.jpeg" alt="Foto Profil Raifal" class="profile-img" id="profilePhoto" />
        </div>
        <div class="greeting">Halo, Saya</div>
        <div class="fullname">Raifal Fadhal Zahran</div>
        <div class="username">@Refal</div>
        <ul class="nav-menu">
          <li>
            <a href="index.html" class="nav-link-custom"><i class="fas fa-home"></i> Beranda</a>
          </li>
          <li>
            <a href="tentang.html" class="nav-link-custom"><i class="fas fa-user"></i> Tentang</a>
          </li>
          <li>
            <a href="project.html" class="nav-link-custom active-link"><i class="fas fa-folder-open"></i> Proyek</a>
          </li>
          <li>
            <a href="kontak.html" class="nav-link-custom"><i class="fas fa-envelope"></i> Kontak</a>
          </li>
          <li>
            <a href="pengalaman.html" class="nav-link-custom"><i class="fas fa-briefcase"></i> Pengalaman PKL</a>
          </li>
        </ul>
        <div class="theme-switch-wrapper">
          <div class="dark-mode-btn" id="darkModeToggle"><i class="fas fa-moon"></i><span>Mode Gelap</span></div>
        </div>
      </aside>

      <main class="main-content">
        <!-- MOBILE MODERN HEADER (hanya tampil di mobile) -->
        <div class="mobile-header">
          <div class="menu-icon" id="mobileMenuIcon">
            <i class="fas fa-bars"></i>
          </div>
          <div class="brand">Raifal.dev</div>
          <div class="right-placeholder"></div>
        </div>

        <div class="info-badge">
          <div class="location-chip"><i class="fas fa-map-marker-alt"></i> Depok, Indonesia</div>
          <div class="open-chip"><i class="fas fa-laptop-code"></i> Portofolio Karya</div>
        </div>

        <h2 class="section-title"><i class="fas fa-camera me-2"></i> Galeri Foto Projek</h2>
        <div class="project-grid" id="photoGrid"></div>

        <h2 class="section-title"><i class="fas fa-video me-2"></i> Video Dokumentasi</h2>
        <div class="project-grid" id="videoGrid"></div>

        <div class="last-updated" id="lastUpdated"></div>
      </main>
    </div>

    <!-- Modal Lightbox Full Resolution -->
    <div class="modal fade image-modal" id="imageModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-transparent">
          <div class="modal-body p-0 text-end">
            <button type="button" class="btn-close btn-close-white mb-2" data-bs-dismiss="modal" aria-label="Close"></button>
            <img id="modalImage" src="" alt="Full size" />
            <p id="modalCaption" class="text-white mt-2 bg-dark bg-opacity-50 d-inline-block px-3 py-1 rounded-pill" style="font-size: 0.9rem"></p>
          </div>
        </div>
      </div>
    </div>

    <div id="toastMsg" class="custom-toast"><i class="fas fa-info-circle"></i> <span id="toastText"></span></div>
    <div id="backToTop" class="back-to-top"><i class="fas fa-arrow-up"></i></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function () {
        // ========== MOBILE DRAWER LOGIC ==========
        const sidebar = document.getElementById('mainSidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const mobileMenuIcon = document.getElementById('mobileMenuIcon');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');

        function openSidebar() {
          if (window.innerWidth <= 850) {
            sidebar.classList.add('open');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
          }
        }
        function closeSidebar() {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
          document.body.style.overflow = '';
        }

        if (mobileMenuIcon) mobileMenuIcon.addEventListener('click', openSidebar);
        if (closeSidebarBtn) closeSidebarBtn.addEventListener('click', closeSidebar);
        if (overlay) overlay.addEventListener('click', closeSidebar);

        window.addEventListener('resize', function () {
          if (window.innerWidth > 850) {
            if (sidebar.classList.contains('open')) closeSidebar();
            document.body.style.overflow = '';
          } else {
            if (sidebar.classList.contains('open')) closeSidebar();
          }
        });

        // Tutup sidebar saat klik link navigasi di mobile
        const navLinks = document.querySelectorAll('.nav-menu .nav-link-custom');
        navLinks.forEach(link => {
          link.addEventListener('click', () => {
            if (window.innerWidth <= 850) {
              closeSidebar();
            }
          });
        });

        // ================= DARK MODE =================
        const toggleBtn = document.getElementById('darkModeToggle');
        const iconTheme = toggleBtn.querySelector('i');
        const textSpan = toggleBtn.querySelector('span');
        function updateDarkModeUI(isDark) {
          if (isDark) {
            iconTheme.classList.remove('fa-moon');
            iconTheme.classList.add('fa-sun');
            textSpan.innerText = 'Mode Terang';
          } else {
            iconTheme.classList.remove('fa-sun');
            iconTheme.classList.add('fa-moon');
            textSpan.innerText = 'Mode Gelap';
          }
        }
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'dark') {
          document.body.classList.add('dark');
          updateDarkModeUI(true);
        } else if (storedTheme === 'light') {
          document.body.classList.remove('dark');
          updateDarkModeUI(false);
        } else {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark');
            updateDarkModeUI(true);
            localStorage.setItem('theme', 'dark');
          } else {
            document.body.classList.remove('dark');
            updateDarkModeUI(false);
            localStorage.setItem('theme', 'light');
          }
        }
        toggleBtn.addEventListener('click', () => {
          const isDark = document.body.classList.contains('dark');
          if (isDark) {
            document.body.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            updateDarkModeUI(false);
          } else {
            document.body.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            updateDarkModeUI(true);
          }
        });

        // ================= TOAST =================
        const toastEl = document.getElementById('toastMsg');
        const toastTextSpan = document.getElementById('toastText');
        function showToast(msg, icon = 'fas fa-info-circle') {
          toastTextSpan.innerText = msg;
          const i = toastEl.querySelector('i');
          if (i) i.className = `${icon} me-2`;
          toastEl.classList.add('show');
          setTimeout(() => toastEl.classList.remove('show'), 2000);
        }

        // ================= DATA FOTO + LINKS DEMO =================
        const photos = [
          {
            file: 'foto1.jpg',
            title: 'Aplikasi Peminjaman Buku Perpustakaan',
            caption: 'Sistem manajemen peminjaman buku di perpustakaan.',
            tech: 'HTML, CSS, JavaScript, PHP Murni, MySQL',
            demoLink: null,
          },
          {
            file: 'foto2.jpg',
            title: 'Aplikasi Novel Digital',
            caption: 'Platform baca dan kelola koleksi novel secara online.',
            tech: 'HTML, CSS, JavaScript, PHP Murni, MySQL',
            demoLink: null,
          },
          {
            file: 'foto3.jpg',
            title: 'E-commerce Pernak-pernik',
            caption: 'Toko online untuk berbagai aksesoris dan pernak-pernik.',
            tech: 'HTML, CSS, JavaScript',
            demoLink: 'https://refal45.github.io/manik-manik/pernak-pernik/index.html',
          },
          {
            file: 'foto4.jpg',
            title: 'Undangan & Manajemen Ulang Tahun',
            caption: 'Aplikasi undangan digital dan pengelola acara ultah.',
            tech: 'HTML, CSS, JavaScript',
            demoLink: 'https://refal45.github.io/ultah/ultah/index.html',
          },
          {
            file: 'foto5.jpg',
            title: 'Sistem Informasi UMKM Tasikmalaya',
            caption: 'Dashboard dan pemasaran produk UMKM berbasis web.',
            tech: 'HTML, CSS, JavaScript, PHP Murni, MySQL, Domaenesia, Hosting',
            demoLink: 'https://umkmserangjuara.com/',
          },
          {
            file: 'foto6.jpg',
            title: 'Portofolio Teknologi HTML, CSS & JS',
            caption: 'Kumpulan proyek front-end modern: landing page, komponen interaktif, dan utility CSS murni.',
            tech: 'HTML, CSS, JavaScript',
            demoLink: 'https://refal45.github.io/portofolio/portofolio/index.html',
          },
        ];

        const photoGrid = document.getElementById('photoGrid');
        const modal = new bootstrap.Modal(document.getElementById('imageModal'));
        const modalImage = document.getElementById('modalImage');
        const modalCaption = document.getElementById('modalCaption');

        photos.forEach((photo) => {
          const card = document.createElement('div');
          card.className = 'project-card';
          card.innerHTML = `
            <img src="${photo.file}" alt="${photo.title}" loading="lazy" style="cursor:pointer;" />
            <div class="project-info">
              <div class="project-title">${photo.title}</div>
              <div class="project-caption">${photo.caption}</div>
              <div class="tech-stack-badge"><i class="fas fa-code"></i> ${photo.tech}</div>
            </div>
          `;

          const imgElement = card.querySelector('img');
          imgElement.addEventListener('click', (e) => {
            e.stopPropagation();
            modalImage.src = photo.file;
            modalCaption.innerText = `${photo.title} | ${photo.tech}`;
            modal.show();
          });

          if (photo.demoLink) {
            const infoDiv = card.querySelector('.project-info');
            const demoAnchor = document.createElement('a');
            demoAnchor.href = photo.demoLink;
            demoAnchor.target = '_blank';
            demoAnchor.rel = 'noopener noreferrer';
            demoAnchor.className = 'demo-link';
            demoAnchor.innerHTML = '<i class="fas fa-external-link-alt"></i> Live Demo →';
            demoAnchor.addEventListener('click', (e) => e.stopPropagation());
            infoDiv.appendChild(demoAnchor);
          }

          card.addEventListener('click', (e) => {
            if (e.target.closest('.demo-link')) return;
            if (e.target === imgElement || imgElement.contains(e.target)) return;
            showToast(`📸 ${photo.title} — ${photo.caption} (${photo.tech})`, 'fas fa-image');
          });

          photoGrid.appendChild(card);
        });

        // ================= DATA VIDEO =================
        const videos = [
          { name: 'kampus.mp4', title: 'Sistem Informasi Kampus', caption: 'Manajemen data mahasiswa, dosen, dan jadwal kuliah.', tech: 'HTML, CSS, JavaScript, PHP Murni, MySQL' },
          { name: 'cafe.mp4', title: 'Aplikasi Pemesanan Cafe', caption: 'Sistem pemesanan menu cafe secara online.', tech: 'HTML, CSS, JavaScript, PHP Murni, MySQL' },
          { name: 'laundry.mp4', title: 'Manajemen Laundry', caption: 'Aplikasi pengelolaan transaksi laundry.', tech: 'HTML, CSS, Laravel, PHP, MySQL' },
          { name: 'parkir.mp4', title: 'Sistem Parkir Otomatis', caption: 'Manajemen kendaraan masuk/keluar dan perhitungan biaya.', tech: 'HTML, CSS, JavaScript, PHP Murni, MySQL' },
          { name: 'perjalanan.mp4', title: 'Aplikasi Perjalanan', caption: 'Dokumentasi dan manajemen perjalanan wisata.', tech: 'HTML, CSS, JavaScript, PHP Murni, MySQL' },
          { name: 'pernikahan.mp4', title: 'Undangan Pernikahan Digital', caption: 'Platform undangan online konfirmasi kehadiran.', tech: 'HTML, CSS, JavaScript, PHP Murni, MySQL' },
          { name: 'sekolah.mp4', title: 'Sistem Informasi Sekolah', caption: 'Manajemen data siswa, guru, dan nilai.', tech: 'HTML, CSS, JavaScript, PHP Murni, MySQL' },
        ];

        const videoGrid = document.getElementById('videoGrid');
        videos.forEach((video) => {
          const card = document.createElement('div');
          card.className = 'project-card';
          card.innerHTML = `
            <video controls preload="metadata" playsinline>
              <source src="${video.name}" type="video/mp4">
              Browser tidak mendukung video.
            </video>
            <div class="project-info">
              <div class="project-title">${video.title}</div>
              <div class="project-caption">${video.caption}</div>
              <div class="tech-stack-badge"><i class="fas fa-code"></i> ${video.tech}</div>
            </div>
          `;
          
          // Event listener untuk memastikan fullscreen menggunakan contain
          const videoEl = card.querySelector('video');
          if (videoEl) {
            videoEl.addEventListener('fullscreenchange', () => {
              if (document.fullscreenElement === videoEl) {
                videoEl.style.objectFit = 'contain';
                videoEl.style.width = '100vw';
                videoEl.style.height = '100vh';
                videoEl.style.backgroundColor = '#000';
              } else {
                videoEl.style.objectFit = '';
                videoEl.style.width = '';
                videoEl.style.height = '';
                videoEl.style.backgroundColor = '';
              }
            });
            videoEl.addEventListener('webkitfullscreenchange', () => {
              if (document.webkitFullscreenElement === videoEl) {
                videoEl.style.objectFit = 'contain';
                videoEl.style.width = '100vw';
                videoEl.style.height = '100vh';
                videoEl.style.backgroundColor = '#000';
              } else {
                videoEl.style.objectFit = '';
                videoEl.style.width = '';
                videoEl.style.height = '';
                videoEl.style.backgroundColor = '';
              }
            });
          }
          
          card.addEventListener('click', (e) => {
            if (!e.target.closest('video') && !e.target.closest('.demo-link')) {
              showToast(`🎬 ${video.title} — ${video.caption} (${video.tech})`, 'fas fa-film');
            }
          });
          videoGrid.appendChild(card);
        });

        // ================= BACK TO TOP =================
        const backBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
          if (window.scrollY > 300) backBtn.classList.add('show');
          else backBtn.classList.remove('show');
        });
        backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        // ================= LAST UPDATED =================
        const now = new Date();
        const formattedDate = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('lastUpdated').innerHTML = `<i class="far fa-calendar-alt"></i> Terakhir diperbarui: ${formattedDate} | Raifal Fadhal Zahran · Project Gallery <i class="fas fa-external-link-alt ms-1"></i>`;

        // ================= GREETING DINAMIS =================
        const greetingEl = document.querySelector('.greeting');
        const hours = new Date().getHours();
        let greeting = 'Halo, Saya';
        if (hours >= 5 && hours < 11) greeting = '☀️ Selamat pagi,';
        else if (hours >= 11 && hours < 15) greeting = '🌤️ Selamat siang,';
        else if (hours >= 15 && hours < 18) greeting = '🌇 Selamat sore,';
        else greeting = '🌙 Selamat malam,';
        if (greetingEl) greetingEl.innerHTML = `${greeting} <span style="font-weight:600;">Saya</span>`;

        // fallback foto profil
        const profileImg = document.getElementById('profilePhoto');
        if (profileImg) profileImg.onerror = () => (profileImg.src = 'https://placehold.co/120?text=Raifal');
      })();
    </script>
  </body>
</html>
